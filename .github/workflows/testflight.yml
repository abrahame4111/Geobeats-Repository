name: TestFlight build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
      what_to_test:
        description: TestFlight "What to Test" note
        required: true
        default: Test Spotify login, map loading, and multi-user visibility.
        type: string

permissions:
  contents: read

jobs:
  testflight:
    name: Queue iOS TestFlight build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Confirm EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "Missing GitHub secret: EXPO_TOKEN"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Queue EAS production build and TestFlight upload
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_BUNDLE_ID: ${{ vars.IOSBUNDLEID }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
        run: npm run ios:testflight:build -- "${{ inputs.profile }}"
