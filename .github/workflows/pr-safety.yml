name: PR safety

on:
  pull_request:
    branches:
      - main
      - master
      - codex/ios-expo-port
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read

jobs:
  safety:
    name: Secret scan and iOS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Redacted secret scan
        run: python3 scripts/security-secret-scan.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Validate iOS config
        working-directory: frontend
        run: npm run test:ios-config --if-present

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit --pretty false
