# Create a Blueprint from codex/ios-expo-port. This file alone does not deploy.
services:
  - type: web
    name: geobeats-api
    runtime: docker
    plan: free
    branch: codex/ios-expo-port
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: geobeats_testing
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEBUG_TOKEN
        generateValue: true
