<!doctype html>
<html><head><meta charset="utf-8"/><title>GeoBeats Cluster Preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a3a2e; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  /* Fake "map" background so the white pill stands out like on a real Mapbox tile */
  body {
    background:
      radial-gradient(ellipse at 30% 20%, #3a4a3a 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, #2a3a4a 0%, transparent 50%),
      linear-gradient(135deg, #1a2a1a, #243a32 50%, #1a2832);
  }
  .stage {
    display: flex; justify-content: space-around; align-items: center;
    width: 100%; height: 100%;
    gap: 60px; padding: 60px;
  }
  .label {
    position: absolute; top: 18px;
    font-size: 14px; color: #fff; font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .col { position: relative; display: flex; flex-direction: column; align-items: center; }
  .col .label { position: static; margin-bottom: 36px; }

  /* === Cluster styles (identical to /api/mapbox.html) === */
  .cluster {
    position: relative;
    pointer-events: auto;
    cursor: pointer;
    transform-origin: 50% 100%;
  }
  .cluster.n2 { width: 130px; height: 90px; }
  .cluster.n3 { width: 130px; height: 100px; }

  .cluster .pill-bg {
    position: absolute;
    inset: 4px 4px 18px 4px;
    background: #ffffff;
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(20, 0, 40, 0.38),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 0 0 1px rgba(176, 38, 255, 0.10);
  }
  .cluster .tail {
    position: absolute;
    bottom: 6px;
    left: 50%;
    width: 18px; height: 18px;
    background: #ffffff;
    transform: translateX(-50%) rotate(45deg);
    border-bottom-right-radius: 4px;
    box-shadow: 4px 4px 10px rgba(20, 0, 40, 0.2);
    z-index: 1;
  }
  .cluster .stack {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .cluster .av {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid #fff;
    background: #1a0a24;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22);
  }
  .cluster .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .cluster.n2 .av:nth-child(1) { transform: translate(-16px, -4px); z-index: 3; }
  .cluster.n2 .av:nth-child(2) { transform: translate( 16px, -4px); z-index: 2; }

  .cluster.n3 .av:nth-child(1) { transform: translate(0,  -18px); z-index: 4; }
  .cluster.n3 .av:nth-child(2) { transform: translate(-22px, 12px); z-index: 2; }
  .cluster.n3 .av:nth-child(3) { transform: translate( 22px, 12px); z-index: 3; }

  .cluster .overflow {
    position: absolute;
    top: 0; right: -2px;
    min-width: 24px; height: 24px; padding: 0 7px;
    border-radius: 12px;
    background: linear-gradient(135deg, #A259FF, #C026FF);
    color: #fff;
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.2px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    box-shadow: 0 2px 10px rgba(192, 38, 255, 0.55);
    z-index: 10;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="col">
    <div class="label">2 users  ·  .cluster.n2</div>
    <div class="cluster n2">
      <div class="pill-bg"></div>
      <div class="tail"></div>
      <div class="stack">
        <div class="av"><img src="https://i.pravatar.cc/120?img=12"/></div>
        <div class="av"><img src="https://i.pravatar.cc/120?img=33"/></div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="label">3 users  ·  .cluster.n3</div>
    <div class="cluster n3">
      <div class="pill-bg"></div>
      <div class="tail"></div>
      <div class="stack">
        <div class="av"><img src="https://i.pravatar.cc/120?img=12"/></div>
        <div class="av"><img src="https://i.pravatar.cc/120?img=33"/></div>
        <div class="av"><img src="https://i.pravatar.cc/120?img=47"/></div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="label">5 users  ·  +2 overflow badge</div>
    <div class="cluster n3">
      <div class="pill-bg"></div>
      <div class="tail"></div>
      <div class="stack">
        <div class="av"><img src="https://i.pravatar.cc/120?img=12"/></div>
        <div class="av"><img src="https://i.pravatar.cc/120?img=33"/></div>
        <div class="av"><img src="https://i.pravatar.cc/120?img=47"/></div>
      </div>
      <div class="overflow">+2</div>
    </div>
  </div>
</div>
</body></html>
